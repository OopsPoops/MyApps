<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9fb2f2">
<meta name="description" content="MyApps — панель моих приложений и игр: быстрый доступ к проектам, тёмная тема, свой порядок иконок.">
<meta property="og:title" content="MyApps">
<meta property="og:description" content="Панель приложений и игр с тёмной темой и настраиваемым порядком иконок.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/icons/myapps.png">
<link rel="apple-touch-icon" href="assets/icons/myapps.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyApps">
<title>MyApps</title>
<style>
  :root {
    color-scheme: light;
    --text: #17171a;
    --muted: #5b5b66;
    --wall-1: #93a9f8;
    --wall-2: #b4a2ef;
    --wall-3: #ffdcae;
    --nebula-1: rgba(150, 130, 240, .16);
    --nebula-2: rgba(90, 170, 235, .12);
    --star-opacity: .55;
    --vignette: rgba(40, 40, 80, .10);
    --glass: rgba(255,255,255,.5);
    --glass-border: rgba(255,255,255,.72);
    --glass-shadow: 0 10px 30px rgba(30,30,60,.14);
    --switch-bg: rgba(120,120,128,.3);
    --switch-knob: #ffffff;
    --icon-shadow: 0 10px 22px rgba(20,20,50,.2), 0 2px 5px rgba(0,0,0,.1);
    --label-shadow: 0 1px 3px rgba(0,0,0,.35);
    --accent: #0a84ff;
    --focus-ring: #0a84ff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --text: #f5f5f7;
    --muted: #b0b0bb;
    --wall-1: #070a1c;
    --wall-2: #0b1026;
    --wall-3: #04050d;
    --nebula-1: rgba(88, 28, 135, .42);
    --nebula-2: rgba(14, 116, 144, .32);
    --star-opacity: 1;
    --vignette: rgba(0, 0, 12, .38);
    --glass: rgba(22, 24, 48, .55);
    --glass-border: rgba(255,255,255,.1);
    --glass-shadow: 0 10px 30px rgba(0,0,0,.55);
    --switch-bg: rgba(120,120,128,.45);
    --switch-knob: #f5f5f7;
    --icon-shadow: 0 10px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    --label-shadow: 0 1px 4px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background: var(--wall-3);
  }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--wall-3);
    overflow-x: hidden;
  }

  /* ---------- фон: градиент + туманность ---------- */
  body::before {
    content: "";
    position: fixed;
    inset: -12%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(720px 480px at 20% 30%, var(--nebula-1), transparent 62%),
      radial-gradient(820px 560px at 80% 70%, var(--nebula-2), transparent 62%),
      linear-gradient(160deg, var(--wall-1), var(--wall-2) 48%, var(--wall-3));
    animation: nebula-drift 42s ease-in-out infinite alternate;
    transform: translate(var(--bg-x, 0px), var(--bg-y, 0px));
  }
  @keyframes nebula-drift {
    from { translate: 0 0; }
    to   { translate: 1.4% 1.8%; }
  }

  /* ---------- виньетка ---------- */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(115% 95% at 50% 42%, transparent 58%, var(--vignette));
  }

  /* ---------- космос ---------- */
  .starfield {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: var(--star-opacity);
  }

  .page {
    position: relative;
    z-index: 1;
    width: min(100% - 40px, 760px);
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- шапка ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 44px;
  }
  h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1;
    font-weight: 730;
    letter-spacing: -.9px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px 5px 12px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    box-shadow: var(--glass-shadow);
  }
  .theme-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    user-select: none;
    min-width: 44px;
  }
  .switch {
    width: 46px;
    height: 28px;
    padding: 3px;
    border: 0;
    border-radius: 99px;
    background: var(--switch-bg);
    cursor: pointer;
    transition: background .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .switch-knob {
    display: block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--switch-knob);
    box-shadow: 0 2px 6px rgba(0,0,0,.22), 0 0 1px rgba(0,0,0,.1);
    transition: transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  :root[data-theme="dark"] .switch-knob { transform: translateX(18px); }

  .icon-btn {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background .18s ease, transform .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { background: rgba(120,120,128,.16); }
  .icon-btn:active { transform: scale(.88); }
  .icon-btn svg { width: 17px; height: 17px; }

  .done-btn {
    display: none;
    padding: 6px 14px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 12.5px;
    font-weight: 650;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, filter .15s ease;
  }
  .done-btn:active { transform: scale(.94); filter: brightness(.92); }
  body.editing .done-btn { display: block; }
  body.editing .theme-label { display: none; }

  /* ---------- сетка иконок ---------- */
  .apps {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 32px 20px;
    justify-items: center;
    align-items: start;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  .app {
    position: relative;
    width: 100%;
    max-width: 118px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    z-index: 1;
  }

  .app-icon {
    position: relative;
    width: min(100%, 108px);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border-radius: 24%;       /* squircle-подобное скругление */
    overflow: hidden;
    box-shadow: var(--icon-shadow);
    transition: transform .22s cubic-bezier(.34,1.56,.64,1),
                box-shadow .22s ease,
                opacity .18s ease;
  }
  .app-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .app-image.sema-image { object-position: center 38%; }
  .app-image.exchange-image { object-position: center 40%; }
  .app-image.contain-image {
    object-fit: contain;
    background: var(--glass);
  }
  /* глянцевый блик сверху — как у иконок iOS */
  .app-icon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 48%);
    pointer-events: none;
  }

  .app-name {
    font-size: 13.5px;
    font-weight: 560;
    letter-spacing: -.1px;
    text-align: center;
    line-height: 1.15;
    text-shadow: var(--label-shadow);
  }

  .app:hover .app-icon { transform: translateY(-2px) scale(1.02); }
  .app:active .app-icon { transform: scale(.93); }

  .app:focus-visible .app-icon {
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
  }
  .icon-btn:focus-visible,
  .switch:focus-visible,
  .done-btn:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .app.opening .app-icon {
    transform: scale(.84);
    opacity: .55;
  }

  .app.dragging { z-index: 100; cursor: grabbing; }
  .app.dragging .app-icon {
    transform: scale(1.14);
    box-shadow: 0 26px 52px rgba(0,0,0,.38), 0 4px 12px rgba(0,0,0,.2);
  }

  /* ---------- iOS-«дрожание» ----------
     Используем независимое свойство `rotate`,
     чтобы оно не конфликтовало с FLIP-`transform`. */
  @keyframes jiggle {
    from { rotate: -1.4deg; }
    to   { rotate:  1.4deg; }
  }
  .apps.editing .app:not(.dragging) {
    animation: jiggle .28s ease-in-out infinite alternate;
  }
  .apps.editing .app:nth-child(2n):not(.dragging) {
    animation-delay: .14s;
  }

  .games-title {
    margin: 42px 0 24px;
    font-size: 21px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -.4px;
  }

  @media (max-width: 480px) {
    .page {
      width: min(100% - 34px, 420px);
      padding-top: max(48px, calc(env(safe-area-inset-top, 0px) + 24px));
    }
    header { margin-bottom: 38px; }
    h1 { font-size: 26px; }
    .apps { gap: 28px 14px; }
    .app { max-width: 96px; }
    .app-icon { width: 82px; border-radius: 23%; }
    .app-name { font-size: 12.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>MyApps</h1>
    <div class="controls">
      <span class="theme-label" id="theme-label">Светлая</span>
      <button class="switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Переключить тему">
        <span class="switch-knob"></span>

      <button class="icon-btn" id="refresh-btn" type="button" aria-label="Обновить страницу" title="Обновить страницу">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8.1 8.1 0 0 0-14.9-4L3 10"/>

  <section class="apps" id="apps" aria-label="Мои приложения">

    <button class="app" type="button" data-id="budget" data-url="https://oopspoops.github.io/budget-app/">

    <button class="app" type="button" data-id="game-dendy" data-url="https://t.me/DendyRetroBot/DendyRetro">

</main>

<noscript>
  <p style="text-align:center;color:var(--muted);font-size:14px;">
    Для работы MyApps нужен включённый JavaScript.
  </p>
</noscript>

<script>
(() => {
  const root       = document.documentElement;
  const themeBtn   = document.getElementById('theme-switch');
  const themeLabel = document.getElementById('theme-label');
  const refreshBtn = document.getElementById('refresh-btn');
  const doneBtn    = document.getElementById('done-btn');
  const grids      = [...document.querySelectorAll('.apps')];

  const ORDER_KEYS = {
    apps: 'myapps-order-v1',
    games: 'myapps-games-order-v1',
  };
  const THEME_KEY = 'myapps-theme-v1';

  let editMode      = false;
  let pressTimer    = null;
  let drag          = null;      // { el, grabX, grabY, layoutRect, tx, ty }
  let pointerInfo   = null;
  let suppressClick = false;

  /* ---------- космос: мерцающие звёзды ---------- */
  const STAR_THEMES = {
    // 'lighter' на светлом фоне осветляет его — звёзды пропадают,
    // поэтому в light используем обычное source-over
    light: { colors: ['96,102,170', '126,112,196', '72,132,178'], alpha: .75, comp: 'source-over' },
    dark:  { colors: ['255,255,255', '255,244,214', '190,205,255'], alpha: 1, comp: 'lighter' },
  };
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const starCanvas = document.createElement('canvas');
  starCanvas.className = 'starfield';
  document.body.prepend(starCanvas);
  const sctx = starCanvas.getContext('2d');
  let stars = [];
  let starW = 0, starH = 0;

  // параллакс: -1..1, цель от курсора, текущее — с инерцией
  let parX = 0, parY = 0, targetX = 0, targetY = 0;
  const bgRoot = document.body.style;

  function buildStars() {
    starW = window.innerWidth;
    starH = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    starCanvas.width = starW * dpr;
    starCanvas.height = starH * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const theme = root.dataset.theme === 'dark' ? 'dark' : 'light';
    const palette = STAR_THEMES[theme];
    const count = Math.min(900, Math.floor(starW * starH / 1600));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * starW,
        y: Math.random() * starH,
        r: .4 + Math.random() * 1.3,
        color: palette.colors[(Math.random() * palette.colors.length) | 0],
        alpha: palette.alpha,
        comp: palette.comp,
        depth: .35 + Math.random() * .65,
        base: .35 + Math.random() * .6,
        speed: .6 + Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2,
        glow: palette.comp === 'lighter' && Math.random() < .1,
      });
    }
  }

  function drawStars(time) {
    sctx.clearRect(0, 0, starW, starH);
    sctx.globalCompositeOperation = stars.length ? stars[0].comp : 'source-over';
    for (const s of stars) {
      const px = s.x - parX * 14 * s.depth;
      const py = s.y - parY * 10 * s.depth;
      const a = s.base * (.55 + .45 * Math.sin(time * s.speed + s.phase)) * s.alpha;
      if (s.glow) {
        sctx.fillStyle = `rgba(${s.color},${(a * .16).toFixed(3)})`;
        sctx.beginPath();
        sctx.arc(px, py, s.r * 4, 0, 6.2832);
        sctx.fill();
      }
      sctx.fillStyle = `rgba(${s.color},${a.toFixed(3)})`;
      sctx.beginPath();
      sctx.arc(px, py, s.r, 0, 6.2832);
      sctx.fill();
    }
  }

  buildStars();
  if (reduceMotion) {
    drawStars(0);
  } else {
    const tick = ts => {
      parX += (targetX - parX) * .06;
      parY += (targetY - parY) * .06;
      bgRoot.setProperty('--bg-x', (-parX * 10).toFixed(2) + 'px');
      bgRoot.setProperty('--bg-y', (-parY * 8).toFixed(2) + 'px');
      drawStars(ts * .001);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  if (!reduceMotion) {
    window.addEventListener('pointermove', event => {
      targetX = (event.clientX / window.innerWidth  - .5) * 2;
      targetY = (event.clientY / window.innerHeight - .5) * 2;
    }, { passive: true });
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildStars, 150);
  });

  /* ---------- тема ---------- */
  function setTheme(theme) {
    root.dataset.theme = theme;
    const dark = theme === 'dark';
    themeBtn.setAttribute('aria-checked', String(dark));
    themeLabel.textContent = dark ? 'Тёмная' : 'Светлая';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? '#070a1c' : '#9fb2f2';
    buildStars();
    if (reduceMotion) drawStars(0);
    try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
  }

  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch (_) {}
  setTheme(savedTheme);

  themeBtn.addEventListener('click', () => {
    setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  refreshBtn.addEventListener('click', () => window.location.reload());

  /* ---------- порядок ---------- */
  function saveOrder(grid) {
    try {
      localStorage.setItem(
        ORDER_KEYS[grid.id],
        JSON.stringify([...grid.children].map(el => el.dataset.id))
      );
    } catch (_) {}
  }

  function restoreOrder(grid) {
    try {
      const savedOrder = localStorage.getItem(ORDER_KEYS[grid.id]) ||
        (grid.id === 'games' ? localStorage.getItem(ORDER_KEYS.apps) : null);
      const order = JSON.parse(savedOrder || '[]');
      if (!Array.isArray(order)) return;
      order.forEach(id => {
        const item = [...grid.children].find(el => el.dataset.id === id);
        if (item) grid.appendChild(item);
      });
      // иконки, которых нет в сохранённом порядке (новые в HTML), — в конец
      [...grid.children]
        .filter(el => !order.includes(el.dataset.id))
        .forEach(el => grid.appendChild(el));
    } catch (_) {}
  }
  grids.forEach(restoreOrder);

  /* ---------- режим редактирования ---------- */
  function setEditMode(value) {
    if (editMode === value) return;
    editMode = value;
    grids.forEach(grid => grid.classList.toggle('editing', value));
    document.body.classList.toggle('editing', value);
  }
  doneBtn.addEventListener('click', () => setEditMode(false));

  /* ---------- утилиты ---------- */
  // Возвращает «layout»-прямоугольник без учёта inline-transform
  function layoutRect(el) {
    const prev = el.style.transform;
    el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = prev;
    return r;
  }

  /* ---------- drag ---------- */
  function beginDrag(el, x, y) {
    const r = el.getBoundingClientRect();
    drag = {
      el,
      grabX: x - r.left,
      grabY: y - r.top,
      layoutRect: r,
      tx: 0,
      ty: 0,
    };
    el.classList.add('dragging');
    el.style.transition = 'none';
    el.style.transform  = 'translate(0px, 0px)';
    setEditMode(true);
    suppressClick = true;
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (_) {} }
  }

  function updateDrag(x, y) {
    if (!drag) return;
    drag.tx = x - drag.grabX - drag.layoutRect.left;
    drag.ty = y - drag.grabY - drag.layoutRect.top;
    drag.el.style.transform = `translate(${drag.tx}px, ${drag.ty}px)`;
    maybeReorder(x, y);
  }

  function maybeReorder(x, y) {
    if (!drag) return;

    const grid = drag.el.parentElement;
    const siblings = [...grid.children].filter(c => c !== drag.el);
    if (!siblings.length) return;

    // ближайший сосед к пальцу
    let best = null, bestD = Infinity;
    for (const el of siblings) {
      const r  = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top  + r.height / 2;
      const d  = (x - cx) ** 2 + (y - cy) ** 2;
      if (d < bestD) { bestD = d; best = { el, r, cx, cy }; }
    }
    if (!best) return;

    const before =
      (y < best.cy - best.r.height * 0.3) ||
      (Math.abs(y - best.cy) <= best.r.height * 0.3 && x < best.cx);

    const prevNext = drag.el.nextSibling;

    // запоминаем позиции соседей для FLIP
    const fromPositions = new Map();
    for (const el of siblings) fromPositions.set(el, el.getBoundingClientRect());

    if (before) grid.insertBefore(drag.el, best.el);
    else        grid.insertBefore(drag.el, best.el.nextSibling);

    // позиция не изменилась — выходим
    if (drag.el.nextSibling === prevNext) return;

    // 1. «схваченный» элемент остаётся визуально на месте
    const visualLeft = drag.layoutRect.left + drag.tx;
    const visualTop  = drag.layoutRect.top  + drag.ty;
    drag.layoutRect  = layoutRect(drag.el);
    drag.tx = visualLeft - drag.layoutRect.left;
    drag.ty = visualTop  - drag.layoutRect.top;
    drag.el.style.transform = `translate(${drag.tx}px, ${drag.ty}px)`;

    // 2. остальные плавно разъезжаются (FLIP)
    for (const el of siblings) {
      const from = fromPositions.get(el);
      const to   = el.getBoundingClientRect();
      const dx = from.left - to.left;
      const dy = from.top  - to.top;
      if (!dx && !dy) continue;

      el.style.transition = 'none';
      el.style.transform  = `translate(${dx}px, ${dy}px)`;
      void el.offsetWidth;
      el.style.transition = 'transform .28s cubic-bezier(.22,1,.36,1)';
      el.style.transform  = '';
    }
  }

  function endDrag() {
    if (!drag) return;
    const el = drag.el;
    el.style.transition = 'transform .32s cubic-bezier(.22,1,.36,1)';
    el.style.transform  = 'translate(0px, 0px)';
    el.classList.remove('dragging');
    setTimeout(() => {
      el.style.transition = '';
      el.style.transform  = '';
    }, 340);
    drag = null;
    saveOrder(el.parentElement);
  }

  /* ---------- pointer-события ----------
     Слушаем pointermove/pointerup на `document`,
     чтобы перетаскивание не ломалось при выходе за пределы иконки. */
  function onPointerDown(event) {
    const item = event.target.closest('.app');
    if (!item) return;
    if (event.pointerType === 'mouse' && event.button !== 0) return;

    suppressClick = false;
    pointerInfo = {
      item,
      sx: event.clientX,
      sy: event.clientY,
      x:  event.clientX,
      y:  event.clientY,
    };

    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      if (!pointerInfo) return;
      beginDrag(pointerInfo.item, pointerInfo.x, pointerInfo.y);
      pressTimer = null;
    }, 450);
  }

  function onPointerMove(event) {
    if (drag) {
      updateDrag(event.clientX, event.clientY);
      return;
    }
    if (!pointerInfo || !pressTimer) return;

    pointerInfo.x = event.clientX;
    pointerInfo.y = event.clientY;

    if (Math.hypot(event.clientX - pointerInfo.sx,
                   event.clientY - pointerInfo.sy) > 12) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  }

  function onPointerUp() {
    clearTimeout(pressTimer);
    pressTimer = null;
    pointerInfo = null;
    if (drag) {
      endDrag();
      suppressClick = true;
    }
  }

  grids.forEach(grid => grid.addEventListener('pointerdown', onPointerDown));
  document.addEventListener('pointermove', onPointerMove, { passive: true });
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);

  // Пока идёт перетаскивание — запрещаем скролл страницы пальцем.
  // До начала drag скролл работает нормально (touch-action: manipulation).
  document.addEventListener('touchmove', event => {
    if (drag) event.preventDefault();
  }, { passive: false });

  /* ---------- клики ---------- */
  grids.forEach(grid => {
    grid.addEventListener('click', event => {
      const item = event.target.closest('.app');
      if (!item) return;

      if (suppressClick) {
        suppressClick = false;
        event.preventDefault();
        return;
      }
      if (editMode) {
        event.preventDefault();
        return;
      }
      const url = item.dataset.url;
      if (!url) return;

      item.classList.add('opening');
      setTimeout(() => item.classList.remove('opening'), 220);
      window.open(url, '_blank', 'noopener,noreferrer');
    });

    grid.addEventListener('contextmenu', e => e.preventDefault());
  });

  document.addEventListener('click', event => {
    if (editMode &&
        !event.target.closest('.app') &&
        !event.target.closest('.done-btn')) {
      setEditMode(false);
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && editMode) setEditMode(false);
  });
})();
</script>
</body>
</html>
